name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - integration/backend-supabase
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repository does not yet contain a lockfile. Keep this aligned with
      # the quality workflow until dependency locking is introduced.
      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Verify the application
        run: |
          npm test
          npm run lint
          npm run build

      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error title=Missing Cloudflare token::Add CLOUDFLARE_API_TOKEN to this repository's GitHub Actions secrets."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error title=Missing Cloudflare account ID::Add CLOUDFLARE_ACCOUNT_ID to this repository's GitHub Actions secrets."
            exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Validate Worker configuration
        run: npx wrangler deploy --dry-run --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
