name: Deploy isolated preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jackier-isolated-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated configuration
        run: node scripts/prepare-preview.mjs
        env:
          PREVIEW_SUPABASE_URL: ${{ vars.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install and verify
        run: |
          npm install --no-package-lock
          npm test
          npm run lint
          npx ng build --configuration preview
      - name: Deploy only the preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'PREVIEW_SUPABASE_SERVICE_ROLE_KEY']) {
            if (!process.env[name]) throw new Error(`Missing preview credential: ${name}`);
          }
          writeFileSync('.preview/secrets.json', JSON.stringify({ SUPABASE_SERVICE_ROLE_KEY: process.env.PREVIEW_SUPABASE_SERVICE_ROLE_KEY }), { mode: 0o600 });
          JS
          npx wrangler deploy --config .preview/wrangler.json --dry-run
          npx wrangler deploy --config .preview/wrangler.json --secrets-file .preview/secrets.json
      - name: Remove temporary credentials
        if: always()
        run: rm -f .preview/secrets.json
