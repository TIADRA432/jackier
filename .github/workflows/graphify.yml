name: Update Graphify knowledge graph

on:
  push:
    branches:
      - '**'
    # The workflow's own generated commit must not trigger another run.
    paths-ignore:
      - 'graphify-out/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  graphify:
    # A second safety net against commit loops when the workflow uses GITHUB_TOKEN.
    if: github.actor != 'github-actions[bot]'
    name: Map repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user graphifyy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the code-only knowledge graph
        run: |
          # A zero-byte/corrupt graph cannot be used for Graphify's incremental merge.
          # Remove it so Graphify performs a clean rebuild instead of failing the workflow.
          if test -f graphify-out/graph.json && ! python -c "import json; json.load(open('graphify-out/graph.json', encoding='utf-8'))" 2>/dev/null; then
            echo "Existing graph.json is invalid; forcing a clean Graphify rebuild."
            rm -f graphify-out/graph.json
          fi
          graphify extract . --code-only
          # Refresh community names and GRAPH_REPORT.md from the newly extracted graph.
          graphify cluster-only .

      - name: Commit updated graph artefacts
        run: |
          test -f graphify-out/graph.json
          test -f graphify-out/GRAPH_REPORT.md
          git add graphify-out/graph.json graphify-out/GRAPH_REPORT.md
          if test -f graphify-out/graph.html; then git add graphify-out/graph.html; fi

          if git diff --cached --quiet; then
            echo "Graphify output is already current."
            exit 0
          fi

          remote_head="$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | cut -f1)"
          if test "$remote_head" != "$GITHUB_SHA"; then
            echo "Branch advanced from $GITHUB_SHA to $remote_head; a newer Graphify run will publish the graph."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(graphify): update knowledge graph [skip ci]"

          if ! git push origin "HEAD:${{ github.ref_name }}"; then
            remote_head="$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | cut -f1)"
            if test "$remote_head" != "$GITHUB_SHA"; then
              echo "Branch advanced during Graphify publish; leaving publication to the newer workflow run."
              exit 0
            fi
            exit 1
          fi
